function moveToNext(){const cur=STORY[index];const target=resolveTarget(cur.next);index=target==null?Math.min(index+1,STORY.length-1):target;render()}
function advance(){if(!started||modalOpen||transitionBusy||!$('end').hidden)return;if(hiddenUI){restoreUI();return}if(typing){finishTyping();return}const cur=STORY[index];if(cur.mode==='choice')return;if(cur.mode==='center'&&!cur.overlay){transitionBusy=true;clearTimeout(autoTimer);$('center').animate([{opacity:1},{opacity:0}],{duration:1050,easing:'ease-in-out',fill:'forwards'});const move=()=>{if(modalOpen||document.hidden){transitionTimer=setTimeout(move,150);return}for(const a of $('center').getAnimations())a.cancel();moveToNext()};transitionTimer=setTimeout(move,1300);return}moveToNext()}
function begin(n=0){soundReady();if(n===0){choiceState={};storage.set('banka_ch1_interlude_choice_state','{}')}index=Math.max(0,Math.min(STORY.length-1,n));started=true;auto=false;document.querySelector('header').hidden=false;render(true)}
function notify(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(notify.t);notify.t=setTimeout(()=>$('toast').hidden=true,2400)}
function openModal(title,en){focusReturn=document.activeElement;modalOpen=true;clearTimeout(autoTimer);$('modalTitle').textContent=title;$('modalEn').textContent=en;$('modalBody').replaceChildren();$('modal').hidden=false;$('closeModal').focus();return $('modalBody')}
function closeModal(){modalOpen=false;$('modal').hidden=true;focusReturn?.focus();scheduleAuto()}
function button(label,fn){const b=document.createElement('button');b.className='quiet';b.textContent=label;b.onclick=fn;return b}
function settings(){const body=openModal('設定','SETTINGS');for(const [key,label,min,max,step] of [['bgm','音楽',0,100,1],['se','効果音',0,100,1],['speed','文字の待ち時間',0,60,5],['motion','光・ノイズ演出',0,1,1]]){const row=document.createElement('label');row.className='setting';const text=document.createElement('span');text.textContent=label;const input=document.createElement('input');input.type='range';input.min=min;input.max=max;input.step=step;input.value=prefs[key];const output=document.createElement('output');const change=()=>{prefs[key]=Number(input.value);output.textContent=key==='speed'?prefs[key]+'ms':key==='motion'?(prefs[key]?'ON':'OFF'):prefs[key]+'%';storage.set('banka_settings_v4',JSON.stringify(prefs));if(key==='bgm')applyMusic();if(seGain)seGain.gain.value=prefs.se/100};input.oninput=change;input.onchange=()=>{if(key==='se'){soundReady();tone(420)}};change();row.append(text,input,output);body.append(row)}const note=document.createElement('p');note.className='note';note.textContent='文字の待ち時間を短くすると、表示が速くなります。進行は自動保存されます。横画面専用です。端末が縦向きになっても、横長の表示を保ちます。';body.append(note)}
function confirmDialog(title,description,action){const b=openModal(title,'CONFIRM');const p=document.createElement('p');p.className='note';p.textContent=description;const f=document.createElement('div');f.className='panelFooter';f.append(button('キャンセル',closeModal),button('実行する',()=>{closeModal();action()}));b.append(p,f)}
function title(){begin(0)}
function restoreUI(){hiddenUI=false;root.classList.remove('cinema');$('restore').hidden=true;scheduleAuto()}
$('closeModal').onclick=closeModal;
$('next').onclick=advance;$('saveBtn').onclick=()=>notify(save()?'現在の進行を保存しました':'この環境では保存できません');
$('menuBtn').onclick=()=>{const b=openModal('メニュー','PAUSE');const nav=document.createElement('div');nav.className='titleNav';nav.append(button('設定',settings),button('章間を最初から',()=>confirmDialog('章間を最初から','この章間シナリオの冒頭へ戻ります。',()=>begin(0))),button('章間をスキップ',()=>confirmDialog('章間をスキップ','第一章章間の終わりへ進みます。',()=>{index=STORY.findIndex(it=>it.id==='i092');if(index<0)index=STORY.length-1;render()})));b.append(nav)};
$('autoBtn').onclick=()=>{auto=!auto;$('autoBtn').classList.toggle('active',auto);$('autoBtn').textContent=auto?'自動送り ON':'自動送り';scheduleAuto()};
$('hideBtn').onclick=()=>{hiddenUI=true;clearTimeout(autoTimer);root.classList.add('cinema');$('restore').hidden=false};$('restore').onclick=restoreUI;
$('logBtn').onclick=()=>{const b=openModal('会話履歴','BACKLOG');for(let j=0;j<=index;j++){const it=STORY[j];if(!it.text&&!it.phone)continue;const row=document.createElement('div');row.className='logrow';const who=document.createElement('b');who.textContent=it.speaker||(it.phone?'スマートフォン':'—');const p=document.createElement('p');p.textContent=it.text||[it.phone.date,it.phone.time,...it.phone.messages].join('\n');row.append(who,p);b.append(row)}requestAnimationFrame(()=>{const p=b.closest('.panel');p.scrollTop=p.scrollHeight})};
$('returnTitle').onclick=()=>{try{save()}catch(e){};window.location.href='./chapter2-first-half.html?from=chapter1';};
root.addEventListener('click',e=>{if(e.target.closest('button,input,label,#modal'))return;advance()});
document.addEventListener('keydown',e=>{if(modalOpen){if(e.key==='Escape'){e.preventDefault();closeModal()}if(e.key==='Tab'){const els=[...$('modal').querySelectorAll('button,input')].filter(x=>!x.disabled),first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return}if(e.target.closest('button,input'))return;if([' ','Enter','ArrowRight'].includes(e.key)){e.preventDefault();advance()}if(e.key==='Escape'&&started)$('menuBtn').click()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(autoTimer);audio.pause()}else{applyMusic();scheduleAuto()}});
window.addEventListener('pagehide',()=>{if(started)save()});
// Preserve the integration contract for a host game without claiming a bundled chapter.
window.bankaChapter1Interlude={start:()=>begin(0),resume:()=>begin(Math.max(0,savedIndex())),getProgress:()=>({index,total:STORY.length,complete:storage.get('banka_ch1_interlude_complete')==='1'}),skipToEnd:()=>{if(started&&!modalOpen){index=STORY.length-1;render()}},startChapter2:()=>window.dispatchEvent(new CustomEvent('banka:startChapter2',{detail:{from:'ch1_interlude'}}))};

matchMedia('(orientation: portrait)').addEventListener('change',()=>{clearTimeout(autoTimer);applyMusic();scheduleAuto()});
// Chase-clear handoff: no local title screen. Normal entry starts from i000.
// A host/reload may use ?resume=1 to restore the saved chapter-interlude point.
const bridgeResume=new URLSearchParams(location.search).get('resume')==='1';
begin(bridgeResume?Math.max(0,savedIndex()):0);

function titleUiSound(kind='confirm'){
 soundReady();if(!audioContext||!prefs.se)return;
 const ctx=audioContext,now=ctx.currentTime,master=ctx.createGain();
 master.gain.setValueAtTime(.0001,now);master.gain.exponentialRampToValueAtTime(.14,now+.008);master.gain.exponentialRampToValueAtTime(.0001,now+(kind==='tick'?.055:.16));master.connect(seGain);
 const freqs=kind==='back'?[520,390]:kind==='tick'?[760]:[620,930];
 freqs.forEach((freq,i)=>{const osc=ctx.createOscillator(),g=ctx.createGain();osc.type=i===0?'sine':'triangle';osc.frequency.setValueAtTime(freq,now);if(kind==='confirm'&&i===1)osc.frequency.exponentialRampToValueAtTime(1040,now+.11);g.gain.value=kind==='tick'?.32:(i===0?.7:.42);osc.connect(g);g.connect(master);osc.start(now+(kind==='confirm'?i*.024:0));osc.stop(now+(kind==='tick'?.06:.18))});
}
root.addEventListener('pointerdown',()=>{soundReady();applyMusic()},{capture:true});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.id==='returnTitle')titleUiSound('confirm')},{capture:true});

function placeCharacter(){
 const target=$('sprite').classList.contains('distant')?$('sprite'):$('sprite2').classList.contains('distant')?$('sprite2'):null;
 if(!target)return;
 // Ground points in the original 1600 × 900 background, projected with object-fit:cover.
 const points={'P-06':[1170,540,155],'P-07':[1040,515,170],'P-08':[940,600,215],'I-01':[1080,535,180],'I-02':[1000,585,205],'C2-00':[1000,585,205]};
 const [x,y,h]=points[scene]||points['P-07'];const w=root.clientWidth,v=root.clientHeight,k=Math.max(w/1600,v/900),px=x*k+(w-1600*k)/2,py=y*k+(v-900*k)/2;
 Object.assign(target.style,{left:px+'px',top:py+'px',height:h*k+'px',bottom:'auto'});
 Object.assign($('groundShadow').style,{left:px+'px',top:py+'px',width:h*k*.26+'px',height:h*k*.05+'px'});
}
new ResizeObserver(placeCharacter).observe(root);
function phoneBuzz(){
 soundReady();if(!audioContext||!prefs.se)return;
 const ctx=audioContext,t=ctx.currentTime;
 for(const delay of [0,.30]){
  const carrier=ctx.createOscillator(),gain=ctx.createGain(),mod=ctx.createOscillator(),depth=ctx.createGain(),filter=ctx.createBiquadFilter();
  carrier.type='sawtooth';carrier.frequency.value=115;mod.frequency.value=29;depth.gain.value=.025;mod.connect(depth);depth.connect(gain.gain);
  filter.type='lowpass';filter.frequency.value=560;gain.gain.setValueAtTime(.0001,t+delay);gain.gain.linearRampToValueAtTime(.065,t+delay+.025);gain.gain.setValueAtTime(.065,t+delay+.15);gain.gain.linearRampToValueAtTime(.0001,t+delay+.20);
  carrier.connect(filter);filter.connect(gain);gain.connect(seGain);carrier.start(t+delay);mod.start(t+delay);carrier.stop(t+delay+.21);mod.stop(t+delay+.21);
 }
}
