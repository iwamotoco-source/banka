N('彩音だけが、八月三十二日に置き去りになった。'),
Q('悠太は何を言う？',[{text:'……ごめん',tag:'now_sorry'},{text:'どうして一人で決めたんだ',tag:'now_angry'},{text:'もう置いていかない',tag:'now_promise'}]),
C('悠太','……ごめん。',{when:'now_sorry'}),
C('彩音','それは言わないで。\n私がやったの。私が悠太に読ませた。',{when:'now_sorry'}),
C('悠太','どうして一人で決めたんだ。俺にも選ばせろよ。',{when:'now_angry'}),
C('彩音','十四歳の悠太に？\n……選ばせられるわけないよ。',{when:'now_angry'}),
C('悠太','もう置いていかない。今度は絶対に。',{when:'now_promise'}),
C('彩音','……悠太。',{when:'now_promise'}),
C('悠太','じゃあ、どうすりゃいいんだよ。'),
N('十年という時間に対して、正しい言葉などなかった。'),
N('悠太は長く息を吐く。\nそして、顔を上げる。'),
C('悠太','……彩音ちゃん。'),
C('彩音','なに。'),
C('悠太','帰ろう。'),
C('悠太','今度は、二人で。'),
N('彩音の目から、涙が一滴だけ落ちる。'),
C('彩音','……うん。'),
T('第三章　了','十年前の八月三十一日'),
N('——第四章へ。',{bg:'current',place:'八月三十二日・現在',end:true})
];
let idx=0,log=[],auto=false,bgmOn=true,hiddenUI=false,activeBg=0,choiceState={};
const el=id=>document.getElementById(id); const bgA=el('bgA'),bgB=el('bgB'),nameEl=el('name'),textEl=el('text'),placeEl=el('place');
const chL=el('chL'),chC=el('chC'),chR=el('chR'),dialogue=el('dialogue'),cg=el('cg'),cgFrame=el('cgFrame'),paper=el('paper'),paperBody=el('paperBody');
const audio=new Audio();audio.loop=true;audio.volume=.42;
function asset(k){return ASSET[k]||''}
function setBg(key){if(!key)return;const target=activeBg?bgA:bgB,old=activeBg?bgB:bgA;const path=asset(IMGKEY[key]);target.style.backgroundImage=path?`url("${path}"),${BGFALLBACK[key]||BGFALLBACK.dark}`:(BGFALLBACK[key]||BGFALLBACK.dark);target.style.opacity='1';old.style.opacity='0';activeBg=1-activeBg}
function setChar(img,pos,key){img.className='ch '+pos; if(!key){img.classList.remove('show');img.removeAttribute('src');return}img.src=asset(key);img.onerror=()=>{img.style.display='none'};img.onload=()=>{img.style.display='block'};requestAnimationFrame(()=>img.classList.add('show'))}
function setChars(s){setChar(chL,'left',s.left);setChar(chC,'center',s.center);setChar(chR,'right',s.right)}
function showCG(key,label){cgFrame.style.backgroundImage=`url("${asset(key)}")`;cgFrame.dataset.label=label||'イベントCG';cgFrame.classList.remove('missing');const probe=new Image();probe.onload=()=>cgFrame.classList.remove('missing');probe.onerror=()=>{cgFrame.style.backgroundImage='none';cgFrame.classList.add('missing')};probe.src=asset(key);cg.classList.add('show')}
function hideCG(){cg.classList.remove('show')}
function doFlash(){const f=el('flash');f.style.opacity='1';setTimeout(()=>f.style.opacity='0',180)}
function titleCard(s){el('tcBig').textContent=s.titleCard;el('tcSub').textContent=s.sub||'';el('titleCard').classList.add('show');setTimeout(()=>el('titleCard').classList.remove('show'),1600)}
function showPaper(html){paperBody.innerHTML=html;paper.classList.add('show')}
function playBgm(cmd){if(cmd==='stop'){audio.pause();return}if(cmd==='play'&&bgmOn){if(!audio.src)audio.src=asset('bgm_main');audio.play().catch(()=>{})}}
function matchesWhen(s){return !s.when||choiceState[s.when]}
function render(){while(idx<scenes.length&&!matchesWhen(scenes[idx]))idx++;const s=scenes[idx];if(!s)return;
 if(s.titleCard){titleCard(s);idx++;setTimeout(render,1700);return}
 if(s.paper){showPaper(s.paper);idx++;return}
 if(s.cg){showCG(s.cg,s.cgLabel);idx++;return}
 if(s.choice){showChoice(s.choice);return}
 hideCG();paper.classList.remove('show');el('memoryName').classList.toggle('show',s.effect==='memory');if(s.effect==='flash')doFlash();
 if(s.bg)setBg(s.bg);if(s.place)placeEl.textContent=s.place;if(s.bgm)playBgm(s.bgm);setChars(s);
 nameEl.textContent=s.name||'';textEl.textContent=s.text||'';if(s.text){log.push({name:s.name||'',text:s.text});if(log.length>160)log.shift()}
 if(s.end){el('advance').innerHTML='第三章 終了 <span class="dia"></span>'}
 if(auto&&!s.end)setTimeout(next,Math.max(1800,700+(s.text||'').length*65));
}
function next(){if(cg.classList.contains('show')){hideCG();return render()}if(paper.classList.contains('show')){paper.classList.remove('show');return render()}if(el('titleCard').classList.contains('show'))return;const s=scenes[idx];if(s&&s.choice)return;if(idx<scenes.length-1){idx++;render()}}
function showChoice(c){el('choicePrompt').textContent=c.prompt||'';const box=el('choiceButtons');box.innerHTML='';c.options.forEach(o=>{const b=document.createElement('button');b.className='choiceBtn';b.textContent=o.text;b.onclick=e=>{e.stopPropagation();choiceState={};choiceState[o.tag]=true;el('choice').classList.remove('show');idx++;render()};box.appendChild(b)});el('choice').classList.add('show')}
function save(){localStorage.setItem('banka_ch3b',JSON.stringify({idx,choiceState}));toast('保存しました')}
function load(){try{const d=JSON.parse(localStorage.getItem('banka_ch3b'));if(d){idx=d.idx||0;choiceState=d.choiceState||{};render();toast('ロードしました')}}catch(e){toast('セーブデータを読めません')};el('menu').classList.remove('show')}
function toast(t){const x=el('saveToast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1200)}
function showLog(){el('logList').innerHTML=log.map(x=>`<div class="logItem"><span class="logName">${x.name||'—'}</span>${x.text.replace(/\n/g,'<br>')}</div>`).join('');el('log').classList.add('show')}
function toggleAuto(){auto=!auto;toast(auto?'自動送り ON':'自動送り OFF');if(auto)render()}
function toggleBgm(){bgmOn=!bgmOn;if(!bgmOn)audio.pause();else audio.play().catch(()=>{});toast(bgmOn?'BGM ON':'BGM OFF')}
function hideUi(){hiddenUI=!hiddenUI;dialogue.style.opacity=hiddenUI?'0':'1';el('chapter').style.opacity=hiddenUI?'0':'1';el('top').style.opacity=hiddenUI?'0':'1';el('sound').style.opacity=hiddenUI?'0':'1'}
el('app').addEventListener('click',e=>{if(e.target.closest('button,.navlink,#paper'))return;next()});paper.onclick=e=>{e.stopPropagation();paper.classList.remove('show');render()};cg.onclick=e=>{e.stopPropagation();hideCG();render()};
el('saveBtn').onclick=e=>{e.stopPropagation();save()};el('menuBtn').onclick=e=>{e.stopPropagation();el('menu').classList.add('show')};el('logBtn').onclick=e=>{e.stopPropagation();showLog()};el('autoBtn').onclick=e=>{e.stopPropagation();toggleAuto()};el('hideBtn').onclick=e=>{e.stopPropagation();hideUi()};el('sound').onclick=e=>{e.stopPropagation();toggleBgm()};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>el(b.dataset.close).classList.remove('show'));
el('menuSave').onclick=save;el('menuLoad').onclick=load;el('menuAuto').onclick=toggleAuto;el('menuLog').onclick=showLog;el('menuBgm').onclick=toggleBgm;el('menuRestart').onclick=()=>{if(confirm('第三章後半を最初から開始しますか？')){idx=0;choiceState={};el('menu').classList.remove('show');render()}};
document.addEventListener('touchstart',()=>{if(bgmOn&&audio.paused&&audio.src)audio.play().catch(()=>{})},{once:true,passive:true});
setBg('hideout');render();
</script>
