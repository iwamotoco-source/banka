name: Deploy banka to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          shopt -s nullglob
          parts=(banka-site.zip.part-*)
          if (( ${#parts[@]} > 0 )); then
            echo "Found ${#parts[@]} split archive parts"
            cat "${parts[@]}" > /tmp/banka-site.zip
            unzip -q /tmp/banka-site.zip -d _site
          else
            rsync -a \
              --exclude '.git/' \
              --exclude '.github/' \
              --exclude '_site/' \
              --exclude 'banka-site.zip.part-*' \
              ./ _site/
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
