name: Materialize banka and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare site
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          if [[ -f banka-site.ready ]]; then
            expected_parts=$(awk -F= '/^parts=/{print $2}' banka-site.ready)
            expected_sha=$(awk -F= '/^sha256=/{print $2}' banka-site.ready)

            if [[ -z "${expected_parts:-}" || -z "${expected_sha:-}" ]]; then
              echo "Invalid banka-site.ready marker"
              exit 1
            fi

            missing=0
            for ((i=0; i<expected_parts; i++)); do
              part=$(printf 'banka-site.zip.part-%02d' "$i")
              if [[ ! -f "$part" ]]; then
                echo "Missing $part"
                missing=1
              fi
            done

            if [[ "$missing" -ne 0 ]]; then
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              echo "materialize=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            cat banka-site.zip.part-* > /tmp/banka-site.zip
            actual_sha=$(sha256sum /tmp/banka-site.zip | awk '{print $1}')
            if [[ "$actual_sha" != "$expected_sha" ]]; then
              echo "Split archive SHA-256 mismatch"
              echo "expected: $expected_sha"
              echo "actual:   $actual_sha"
              exit 1
            fi

            unzip -q /tmp/banka-site.zip -d _site
            chmod -R u+rwX,go+rX _site
            test -f _site/index.html
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "materialize=true" >> "$GITHUB_OUTPUT"

          elif compgen -G 'banka-site.zip.part-*' > /dev/null; then
            echo "Split upload is incomplete; waiting for banka-site.ready"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "materialize=false" >> "$GITHUB_OUTPUT"
            exit 0

          else
            rsync -a \
              --exclude '.git/' \
              --exclude '.github/' \
              --exclude '_site/' \
              ./ _site/
            chmod -R u+rwX,go+rX _site
            test -f _site/index.html
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "materialize=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize completed site into main
        if: steps.prepare.outputs.materialize == 'true'
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name '_site' \
            -exec rm -rf {} +
          rsync -a _site/ ./
          chmod -R u+rwX,go+rX .

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo '_site/' >> .git/info/exclude
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Expand game site for GitHub Pages'
            git push origin HEAD:main
          fi

      - name: Configure Pages
        if: steps.prepare.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        if: steps.prepare.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        if: steps.prepare.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
